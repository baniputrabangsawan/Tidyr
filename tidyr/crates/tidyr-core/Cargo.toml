[package]
name = "tidyr-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for Tidyr: scan, dedupe, plan, quarantine, undo. No UI/Tauri dependencies."
license = "MIT"

[dependencies]
walkdir = "2"
rayon = "1"
blake3 = "1"
kamadak-exif = "0.6"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
filetime = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
