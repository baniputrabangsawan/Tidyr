[package]
name = "tidyr-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Logika inti Tidyr: pemindaian, deduplikasi, perencanaan, karantina, dan pemulihan (undo)"

[dependencies]
walkdir = "2"
rayon = "1"
blake3 = "1"
kamadak-exif = "0.6"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
filetime = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
