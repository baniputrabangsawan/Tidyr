name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt -p beres-core -p beres-cli -- --check
        working-directory: beres
      - name: clippy
        run: cargo clippy -p beres-core -p beres-cli --all-targets -- -D warnings
        working-directory: beres
      - name: test
        run: cargo test -p beres-core -p beres-cli
        working-directory: beres
      # src-tauri needs OS webviews; check it compiles where possible.
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: check src-tauri
        run: cargo check -p beres
        working-directory: beres

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beres/ui/package-lock.json
      - run: npm ci
        working-directory: beres/ui
      - run: npm run check
        working-directory: beres/ui
      - run: npm run build
        working-directory: beres/ui
