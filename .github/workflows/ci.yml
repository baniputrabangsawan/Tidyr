name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
        working-directory: tidyr
      - name: clippy
        run: cargo clippy -p tidyr-core -p tidyr-cli --all-targets -- -D warnings
        working-directory: tidyr
      - name: test
        run: cargo test -p tidyr-core -p tidyr-cli
        working-directory: tidyr
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tidyr/ui/package-lock.json
      - name: build ui for tauri
        run: npm ci && npm run build
        working-directory: tidyr/ui
      # src-tauri needs OS webviews; check it compiles where possible.
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - name: check src-tauri
        run: cargo check -p tidyr
        working-directory: tidyr
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tidyr/ui/package-lock.json
      - run: npm ci
        working-directory: tidyr/ui
      - run: npm run check
        working-directory: tidyr/ui
      - run: npm run build
        working-directory: tidyr/ui
