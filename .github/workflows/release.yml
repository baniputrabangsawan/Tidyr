name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: windows installer + updater artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tidyr/ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tidyr
      - name: build ui
        run: npm ci && npm run build
        working-directory: tidyr/ui
      - name: build + publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tidyr/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Tidyr ${{ github.ref_name }}"
          releaseBody: "Lihat catatan rilis di bawah."
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true

      - name: build installer (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: tidyr/src-tauri

      - name: upload windows installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tidyr-windows-installer
          path: |
            tidyr/src-tauri/target/release/bundle/nsis/*.exe
            tidyr/src-tauri/target/release/bundle/msi/*.msi
  build-best-effort:
    name: best-effort (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tidyr/ui/package-lock.json
      - name: install targets for universal apple darwin
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tidyr
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - name: build ui
        run: npm ci && npm run build
        working-directory: tidyr/ui
      - name: build + publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tidyr/src-tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Tidyr ${{ github.ref_name }}"
          releaseBody: "Lihat catatan rilis di bawah."
          releaseDraft: false
          prerelease: false

      - name: build installer (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: tidyr/src-tauri
          args: ${{ matrix.args }}

      - name: upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tidyr-${{ matrix.platform }}-installer
          path: |
            tidyr/src-tauri/target/release/bundle/deb/*.deb
            tidyr/src-tauri/target/release/bundle/appimage/*.AppImage
            tidyr/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            tidyr/src-tauri/target/release/bundle/dmg/*.dmg
