name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-windows:
    name: windows installer + updater artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beres/ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: beres/ui
      - name: build + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: beres/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Beres ${{ github.ref_name }}"
          releaseBody: "Lihat catatan rilis di bawah."
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true

  build-best-effort:
    name: best-effort (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beres/ui/package-lock.json
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: beres/ui
      - name: build (no release upload)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: beres/src-tauri
          args: ${{ matrix.args }}
